services:
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app 
      - web_node_modules:/usr/src/app/node_modules 
    env_file:
      - path: ./frontend/.env
        required: false
    develop:
      watch:
        - path: ./frontend
          target: /usr/src/app
          action: sync
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - api_node_modules:/usr/src/app/node_modules
    env_file:
      - ./backend/.env
    develop:
      watch:
        - path: ./backend
          target: /usr/src/app
          action: sync
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://db:27017/loganalyzer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  db:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
  web_node_modules:
  api_node_modules:
